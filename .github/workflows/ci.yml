name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Publication and documentation audit
        run: python scripts/check_publication.py
      - name: Install media tools
        if: matrix.python == '3.12'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Real media and publication regressions
        if: matrix.python == '3.12'
        run: |
          python scripts/validate_media.py --bin-dir /usr/bin
          python scripts/validate_quality.py --bin-dir /usr/bin
