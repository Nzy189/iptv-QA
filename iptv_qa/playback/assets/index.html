<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>网页电视 · iptv-QA</title>
<link rel="stylesheet" href="/tv/style.css">
</head>
<body>
<div id="login" class="login-wrap" hidden>
  <form id="login-form" class="login-card">
    <h1>网页电视</h1>
    <p class="login-sub">输入访问密码</p>
    <input id="login-password" type="password" autocomplete="off" placeholder="访问密码" required>
    <button type="submit" class="primary-btn">进入</button>
    <p id="login-error" class="login-error" hidden>密码不对，请重试</p>
  </form>
</div>
<div id="app" hidden>
  <header class="topbar">
    <button id="menu-btn" class="icon-btn" title="频道列表" aria-label="频道列表">≡</button>
    <div class="topbar-title">网页电视<span id="channel-badge" class="channel-badge"></span></div>
    <div class="topbar-actions">
      <a href="/tv/manage/" class="ctl-btn">管理频道</a><a href="/" class="ctl-btn">频道中心</a>
      <button id="fullscreen-btn" class="icon-btn" title="全屏 (F)" aria-label="全屏">全屏</button>
    </div>
  </header>
  <main class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="source-box">
        <label class="source-label" for="source-url">订阅链接（m3u）</label>
        <div class="source-row">
          <input id="source-url" type="url" placeholder="https://…/iptv_set1.m3u" spellcheck="false">
          <button id="source-load" class="primary-btn">加载</button>
        </div>
        <span class="source-label">选择频道分组 · 多源竞速开启时同时尝试最多五条线路，先出画面者播放</span>
        <div class="presets" id="presets"></div>
      </div>
      <input id="search" type="search" placeholder="搜索频道" aria-label="搜索频道">
      <p id="cleanup-status" class="source-label" role="status"></p>
      <div id="channel-list" class="channel-list"></div>
    </aside>
    <section id="player-area" class="player-area">
      <video id="video" playsinline></video>
      <div id="overlay" class="overlay" hidden>
        <div id="overlay-text" class="overlay-text"></div>
        <button id="retry-btn" class="primary-btn" hidden>重试</button>
      </div>
      <div id="number-entry" class="number-entry" hidden></div>
    </section>
  </main>
  <footer class="controls">
    <button id="prev-btn" class="ctl-btn" title="上一个 (↑)">上一个</button>
    <button id="play-btn" class="ctl-btn" title="播放/暂停 (空格)">播放</button>
    <button id="next-btn" class="ctl-btn" title="下一个 (↓)">下一个</button>
    <button id="random-btn" class="ctl-btn" title="随机 (R)">随机</button>
    <button id="mode-btn" class="ctl-btn" title="增强模式会在当前频道的备用线路都失败后换台">普通模式</button>
    <button id="destruction-btn" class="ctl-btn" aria-pressed="false" disabled title="仅受管频道可用：20秒内耗尽线路仍无法起播，移入可恢复清理区">失效清理：关</button>
    <button id="report-btn" class="ctl-btn" disabled title="画面内容不对（广告/失效提示）时点击：清理当前线路，可在管理页恢复">报错清理</button>
    <button id="order-btn" class="ctl-btn" title="增强模式自动换台顺序" aria-pressed="false">顺序换台</button>
    <button id="race-btn" class="ctl-btn" aria-pressed="true" title="换台时同时尝试最多五条线路，先出画面者播放；关闭后逐条顺序尝试">多源竞速：开</button>
    <button id="prefetch-btn" class="ctl-btn" aria-pressed="false" title="看当前台时后台预热下一个台：关 / 轻量 / 完整">下一台预热：轻量</button>
    <div class="number-box">
      <input id="channel-input" type="number" min="1" placeholder="台号" aria-label="频道号">
      <button id="go-btn" class="ctl-btn">GO</button>
    </div>
    <div class="volume-box">
      <button id="mute-btn" class="icon-btn" title="静音 (M)" aria-label="静音">音量</button>
      <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="音量">
    </div>
    <div id="now-playing" class="now-playing"></div>
  </footer>
</div>
<script src="/tv/hls.min.js"></script>
<script src="/tv/app.js"></script>
</body>
</html>
