<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>频道管理 · iptv-QA</title><link rel="stylesheet" href="/tv/manage.css"></head><body>
<header><div><h1>频道管理</h1><p>统一管理频道与主备线路，发布后同步所有订阅。</p></div><nav><a href="/tv/">播放频道</a><a href="/">频道中心</a></nav></header>
<form id="manager-login" hidden><label>访问密码 <input id="password" type="password" autocomplete="current-password" required></label><button>登录</button></form>
<main id="workspace" hidden>
<section class="toolbar"><select id="scope" aria-label="频道分组"><option value="main">综合频道 · Top5</option><option value="supplement">今日补充</option><option value="english">英语频道</option></select><input id="query" type="search" placeholder="搜索频道或分组" aria-label="搜索"><label><input id="removed" type="checkbox">清理区</label><button id="refresh">刷新</button><button id="publish" class="primary">发布改动</button><button id="backup">私有备份</button></section>
<p id="notice" role="status"></p><section id="preview" class="panel" hidden><p id="preview-text"></p><button id="apply" class="primary">确认操作</button><button id="cancel">取消</button></section>
<div class="columns"><section class="panel"><div class="section-head"><h2>频道总表</h2><span id="counter"></span></div><div id="channels"></div><div class="pagination"><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></div></section>
<section id="detail" class="panel"><h2>频道与线路</h2><p class="muted">从左侧选择频道。停用线路不会删除频道；清理频道仅影响当前分组，支持恢复。</p></section></div>
<section class="panel"><h2>发布与同步</h2><p class="muted">数据库先保存，订阅按版本生成。桶文件逐个上传，完成标记最后写入；失败可以重试。</p><div id="jobs"></div><div id="versions"></div></section>
<section class="panel"><h2>私有备份</h2><p class="muted">备份采用一致快照、认证加密和恢复测试。解密密钥单独保管，不包含在备份中。</p><div id="backups"></div></section>
<details class="panel"><summary>最近操作</summary><div id="audit"></div></details></main>
<script src="/tv/manage.js"></script></body></html>
