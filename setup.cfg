[metadata]
name = iptv-QA
version = 0.1.0
description = IPTV stream quality screening, ranked playlists, and optional OBS publishing
long_description = file: README.md
long_description_content_type = text/markdown
author = Nzy189
url = https://github.com/Nzy189/iptv-QA
license = MIT

[options]
python_requires = >=3.6
py_modules = iptv_checker, quality, reporting, catalog_sources, daily, web

[options.entry_points]
console_scripts =
    iptv-qa = iptv_checker:main
    iptv-qa-run = daily:main
    iptv-qa-web = web:main

[options.extras_require]
obs =
    esdk-obs-python==3.26.6
    certifi>=2024.7.4
