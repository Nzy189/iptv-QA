[metadata]
name = iptv-QA
version = 0.2.0
description = Modular IPTV quality checking, browser playback, publishing and reporting
long_description = file: README.md
long_description_content_type = text/markdown
author = Nzy189
url = https://github.com/Nzy189/iptv-QA
license = MIT

[options]
python_requires = >=3.6
packages = find:
include_package_data = True
py_modules = iptv_checker, quality, reporting, catalog_sources, daily, web, tv

[options.packages.find]
include = iptv_qa*

[options.package_data]
iptv_qa.playback =
    assets/*.html
    assets/*.js
    assets/*.css
    assets/*.txt

[options.entry_points]
console_scripts =
    iptv-qa = iptv_qa.cli:main
    iptv-qa-run = iptv_qa.workflows.scheduled:main
    iptv-qa-web = iptv_qa.server.http:main

[options.extras_require]
backup =
    cryptography>=3.4.8
obs =
    esdk-obs-python==3.26.6
    certifi>=2024.7.4
